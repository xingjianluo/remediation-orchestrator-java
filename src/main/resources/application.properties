# 编排器本地可配置项（均有代码内默认值，可被命令行/环境变量覆盖）
remediation.orchestrator.data-dir=${REMEDIATION_DATA_DIR:data/remediation}
remediation.orchestrator.max-concurrent=4
remediation.orchestrator.default-max-retries=2
remediation.orchestrator.default-backoff-base-millis=200
remediation.orchestrator.default-step-timeout-millis=5000
remediation.orchestrator.default-approval-timeout-seconds=60
remediation.orchestrator.tick-millis=50
remediation.orchestrator.policies-location=classpath:policies.json
